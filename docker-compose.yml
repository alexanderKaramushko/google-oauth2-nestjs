services:
  service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - 3000:3000
    environment:
      - CLIENT_ID
      - CLIENT_SECRET
      - OAUTH_CALLBACK_HOST
      - MONGO_DB_HOST=db
      - MONGO_DB_NAME
      - MONGO_DB_PORT

  db:
    image: mongo:latest
    environment:
      MONGODB_DATABASE: test
    ports:
      - 27017:27017
